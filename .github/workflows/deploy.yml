name: Deploy to Production

# Jalan otomatis setiap ada push (merge) ke branch main.
# Membutuhkan GitHub Secrets berikut di Settings > Secrets and variables > Actions:
#   SSH_HOST            - IP/hostname server production
#   SSH_USER            - username SSH di server
#   SSH_PRIVATE_KEY_B64 - private key SSH, di-encode base64 (hindari private key
#                          mentah di secret, karena paste multi-baris ke form GitHub
#                          rawan rusak/whitespace berubah). Cara generate:
#                            base64 -w0 path/to/deploy_key
#   SSH_PORT            - (opsional) port SSH, default 22
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Decode SSH key
        # Written into the workspace dir, not ~/.ssh: the ssh-action below runs in
        # its own Docker container that only mounts $GITHUB_WORKSPACE, not the
        # runner's home directory.
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > "$GITHUB_WORKSPACE/deploy_key"
          chmod 600 "$GITHUB_WORKSPACE/deploy_key"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: deploy_key
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            bash ~/workshop-repo/deploy.sh

      - name: Clean up key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/deploy_key"
