<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Approval Center</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--white:#FFFFFF;--text:#1A1F36;--text-muted:#6B7394;--border:#E2E6F0;--navy:#0F2A4A;--orange:#E85D1A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 32px rgba(15,42,74,0.08);width:100%;max-width:380px;padding:32px;}
.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.logo-box{width:38px;height:38px;background:var(--orange);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-box svg{width:18px;height:18px;}
.brand-sub{font-size:10px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase;}
.brand-title{font-family:"Syne",sans-serif;font-size:18px;font-weight:800;color:var(--navy);}
h1{font-family:"Syne",sans-serif;font-size:20px;margin-bottom:4px;}
.sub{font-size:12px;color:var(--text-muted);margin-bottom:22px;}
label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px;}
input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;margin-bottom:16px;outline:none;transition:border-color 0.15s;}
input:focus{border-color:var(--navy);}
button{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background 0.15s;}
button:hover{background:#0A1F38;}
button:disabled{opacity:0.6;cursor:not-allowed;}
.error-msg{background:#FEF2F2;color:#C62828;border:1px solid #FFCDD2;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:16px;display:none;}
</style></head>
<body>
<div class="login-card">
  <div class="logo-row">
    <div class="logo-box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></div>
    <div><div class="brand-sub">KAI — Human Capital</div><div class="brand-title">Approval Center</div></div>
  </div>
  <h1>Masuk</h1>
  <div class="sub">Login khusus untuk tim review &amp; approval.</div>
  <div class="error-msg" id="error-msg"></div>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="submit-btn">Masuk</button>
  </form>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const errBox = document.getElementById('error-msg');
  errBox.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Memproses...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Login gagal');
    sessionStorage.setItem('workshop_token', json.token);
    sessionStorage.setItem('workshop_user', JSON.stringify(json.user));
    window.location.href = 'index.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Masuk';
  }
});
</script>
</body></html>
