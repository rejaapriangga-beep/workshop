<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approval Center — KAI Human Capital</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--white:#FFFFFF;--text:#1A1F36;--text-muted:#6B7394;--border:#E2E6F0;--navy:#0F2A4A;--orange:#E85D1A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Plus Jakarta Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--navy);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(15,42,74,0.25);}
.header-left{display:flex;align-items:center;gap:12px;}
.logo-box{width:30px;height:30px;background:var(--orange);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-box svg{width:15px;height:15px;}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.45);letter-spacing:0.12em;text-transform:uppercase;line-height:1;}
.brand-title{font-size:14px;font-weight:700;color:#fff;line-height:1.3;}
.header-right{display:flex;align-items:center;gap:6px;}
.user-chip{font-size:11px;color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.08);padding:5px 10px;border-radius:6px;}
.header-link{font-size:11px;color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.08);padding:5px 10px;border-radius:6px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;}
.header-link:hover{background:rgba(255,255,255,0.16);color:#fff;}
.logout-btn{font-size:11px;color:rgba(239,68,68,0.85);background:rgba(239,68,68,0.1);padding:5px 10px;border-radius:6px;border:1px solid rgba(239,68,68,0.25);cursor:pointer;font-family:inherit;}
.logout-btn:hover{background:rgba(239,68,68,0.2);}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,42,74,0.35);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:380px;padding:28px;box-shadow:0 12px 40px rgba(15,42,74,0.2);}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-head h2{font-size:18px;font-weight:700;}
.modal-close{background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer;line-height:1;}
.modal-close:hover{color:var(--text);}
.modal label{font-size:12px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:6px;}
.modal input{width:100%;padding:11px 13px;border:none;background:#EEF0FF;border-radius:10px;font-family:inherit;font-size:13px;margin-bottom:16px;outline:none;}
.modal input:focus{box-shadow:0 0 0 2px #6D4FE0;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
.btn-primary{background:#6D4FE0;color:#fff;border:none;border-radius:999px;padding:10px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;}
.btn-primary:hover{background:#5A3FC7;}
.btn-ghost{background:none;border:1px solid var(--border);border-radius:999px;padding:10px 18px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-muted);}
.btn-ghost:hover{border-color:var(--text);color:var(--text);}
.form-error{background:#FEF2F2;color:#C62828;border:1px solid #FFCDD2;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:16px;display:none;}
.form-success{background:#EDF7EE;color:#2E8B4E;border:1px solid #CFEAD3;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:16px;display:none;}
.content{max-width:960px;margin:0 auto;padding:40px 24px;}
.page-title{font-family:"Syne",sans-serif;font-size:26px;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text-muted);margin-bottom:28px;}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.module-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:all 0.15s;text-decoration:none;color:inherit;display:block;}
.module-card:hover{border-color:var(--orange);box-shadow:0 6px 20px rgba(232,93,26,0.12);transform:translateY(-2px);}
.module-icon{width:38px;height:38px;background:#FEF0E7;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:18px;}
.module-name{font-family:"Syne",sans-serif;font-size:15px;margin-bottom:6px;}
.module-desc{font-size:12px;color:var(--text-muted);line-height:1.5;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:13px;}
</style></head>
<body>
<header>
  <div class="header-left">
    <div class="logo-box"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg></div>
    <div><div class="brand-sub">KAI — Human Capital</div><div class="brand-title">Approval Center</div></div>
  </div>
  <div class="header-right">
    <div class="user-chip" id="user-chip">—</div>
    <button class="header-link" onclick="openPasswordModal()">Ganti Password</button>
    <a class="header-link" id="manage-users-link" href="manage-users.html" style="display:none;">Kelola User</a>
    <button class="logout-btn" onclick="doLogout()">Keluar</button>
  </div>
</header>
<div class="content">
  <div class="page-title">Pilih Modul</div>
  <div class="page-sub">Modul approval yang tersedia untuk direview.</div>
  <div class="module-grid" id="module-grid">
    <div class="empty-state">Memuat modul...</div>
  </div>
</div>

<div class="overlay" id="password-overlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Ganti Password</h2>
      <button class="modal-close" onclick="closePasswordModal()">✕</button>
    </div>
    <div class="form-error" id="password-error"></div>
    <div class="form-success" id="password-success"></div>
    <form id="password-form">
      <label for="pw-current">Password Lama</label>
      <input id="pw-current" type="password" autocomplete="current-password" required>
      <label for="pw-new">Password Baru</label>
      <input id="pw-new" type="password" autocomplete="new-password" required>
      <label for="pw-confirm">Konfirmasi Password Baru</label>
      <input id="pw-confirm" type="password" autocomplete="new-password" required>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="closePasswordModal()">Batal</button>
        <button type="submit" class="btn-primary" id="password-save-btn">Simpan</button>
      </div>
    </form>
  </div>
</div>
<script>
const token = sessionStorage.getItem('workshop_token');
const userStr = sessionStorage.getItem('workshop_user');
if (!token || !userStr) window.location.replace('login.html');
const user = JSON.parse(userStr || '{}');
document.getElementById('user-chip').textContent = (user.nama || user.email) + ' — ' + user.role;
if (user.role === 'admin') document.getElementById('manage-users-link').style.display = '';

function doLogout() {
  sessionStorage.clear();
  window.location.replace('login.html');
}

function openPasswordModal() {
  document.getElementById('password-error').style.display = 'none';
  document.getElementById('password-success').style.display = 'none';
  document.getElementById('password-form').reset();
  document.getElementById('password-overlay').classList.add('open');
}
function closePasswordModal() {
  document.getElementById('password-overlay').classList.remove('open');
}

document.getElementById('password-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('password-error');
  const okBox = document.getElementById('password-success');
  errBox.style.display = 'none';
  okBox.style.display = 'none';

  const current = document.getElementById('pw-current').value;
  const next = document.getElementById('pw-new').value;
  const confirm = document.getElementById('pw-confirm').value;
  if (next !== confirm) {
    errBox.textContent = 'Konfirmasi password baru tidak cocok';
    errBox.style.display = 'block';
    return;
  }

  const btn = document.getElementById('password-save-btn');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    const res = await fetch('/api/auth/change-password', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ current_password: current, new_password: next }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Gagal mengubah password');
    okBox.textContent = 'Password berhasil diubah.';
    okBox.style.display = 'block';
    document.getElementById('password-form').reset();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
});

const ICONS = { career_path: '🧭' };

async function loadModules() {
  try {
    const res = await fetch('/api/modules', { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { doLogout(); return; }
    const json = await res.json();
    const grid = document.getElementById('module-grid');
    const cards = (json.modules || []).map(m => `
      <a class="module-card" href="${m.url_slug}">
        <div class="module-icon">${ICONS[m.module_key] || '📋'}</div>
        <div class="module-name">${m.module_name}</div>
        <div class="module-desc">${m.description || ''}</div>
      </a>
    `).join('');
    grid.innerHTML = cards || '<div class="empty-state">Belum ada modul approval yang aktif.</div>';
  } catch (e) {
    document.getElementById('module-grid').innerHTML = '<div class="empty-state">Gagal memuat modul: ' + e.message + '</div>';
  }
}
loadModules();
</script>
</body></html>
